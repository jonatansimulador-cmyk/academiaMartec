<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Martec</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap');

    * {
      box-sizing: border-box;
    }

    :root {
      --primary: #3b82f6;
      --primary-grad: linear-gradient(135deg, #06b6d4 0%, #3b82f6 55%, #6366f1 100%);
      --text-main: #0f172a;
      --text-light: #64748b;
      --shadow-relief: 0 20px 50px -12px rgba(59, 130, 246, 0.22), 0 8px 20px -4px rgba(15, 23, 42, 0.08), inset 0 1px 0 rgba(255, 255, 255, 1);
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Outfit', sans-serif;
      background-color: #ffffff;
      background-image:
        radial-gradient(circle at 18% 15%, rgba(6, 182, 212, 0.14) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(99, 102, 241, 0.15) 0%, transparent 42%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .login-card {
      width: 92%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(14px);
      border: 1px solid #e2e8f0;
      border-radius: 26px;
      padding: 42px 36px;
      box-shadow: var(--shadow-relief);
      text-align: center;
    }

    .brand-title {
      margin: 0;
      font-size: 40px;
      font-weight: 900;
      letter-spacing: -1.2px;
      background: linear-gradient(135deg, #0f172a, #2563eb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-sub {
      display: block;
      margin-top: 4px;
      margin-bottom: 30px;
      font-size: 12px;
      font-weight: 800;
      color: #06b6d4;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Outfit', sans-serif;
      color: #0f172a;
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-group input:focus {
      background: #ffffff;
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
    }

    .btn-login {
      width: 100%;
      margin-top: 10px;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: var(--primary-grad);
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      font-family: 'Outfit', sans-serif;
      letter-spacing: 0.8px;
      cursor: pointer;
      box-shadow: 0 12px 24px -6px rgba(59, 130, 246, 0.55), inset 0 2px 2px rgba(255, 255, 255, 0.35);
      transition: all 0.25s ease;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 30px -6px rgba(99, 102, 241, 0.65);
    }

    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .msg-error {
      margin-top: 16px;
      min-height: 20px;
      font-size: 13px;
      font-weight: 700;
      color: #e11d48;
    }

    .watermark {
      position: fixed;
      bottom: 12px;
      right: 16px;
      font-size: 11px;
      color: #94a3b8;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h1 class="brand-title">martec</h1>
    <span class="brand-sub">Plataforma Integral</span>

    <form id="login-form" onsubmit="iniciarSesion(event)">
      <div class="form-group">
        <label for="usuario">Usuario / DNI</label>
        <input type="text" id="usuario" placeholder="Ingresa tu DNI o usuario" autocomplete="username" required>
      </div>

      <div class="form-group">
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn-login" id="btn-ingresar">INGRESAR</button>
      <div class="msg-error" id="msg-error"></div>
    </form>
  </div>

  <div class="watermark">Desarrollado por Jonatan Santiago Guerrero</div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyb5U31hqfuy9v36Q-gMTchEp7NK8MVIf66V_2UxLbyBo6gOk02Gh0Icy-5qOyItWMz/exec';

    window.onload = () => {
      localStorage.removeItem('martec_user');
    };

    async function iniciarSesion(e) {
      e.preventDefault();
      const usuarioInput = document.getElementById('usuario').value.trim();
      const claveInput = document.getElementById('clave').value.trim();
      const msg = document.getElementById('msg-error');
      const btn = document.getElementById('btn-ingresar');

      if (!usuarioInput || !claveInput) {
        msg.innerText = 'Completa todos los campos.';
        return;
      }

      msg.innerText = '';
      btn.disabled = true;
      btn.innerText = 'VERIFICANDO...';

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'leer', tabla: 'Usuarios' })
        });
        const data = await res.json();

        if (!data.success || !Array.isArray(data.data)) {
          throw new Error('No se pudo validar el acceso.');
        }

        const user = data.data.find(u =>
          (u.DNI || '').toString().trim().toLowerCase() === usuarioInput.toLowerCase() &&
          (u.Clave || u.Password || '').toString().trim() === claveInput
        );

        if (!user) {
          msg.innerText = 'Usuario o contraseña incorrectos.';
          btn.disabled = false;
          btn.innerText = 'INGRESAR';
          return;
        }

        if ((user.Estado || 'Activo').toString().trim().toLowerCase() === 'inactivo') {
          msg.innerText = 'Tu usuario se encuentra inactivo.';
          btn.disabled = false;
          btn.innerText = 'INGRESAR';
          return;
        }

        const rol = (user.Rol || 'Asesor').toString().trim();
        localStorage.setItem('martec_user', JSON.stringify({
          usuario: (user.DNI || '').toString().trim(),
          nombres: user.Nombres || '',
          rol: rol,
          equipo: user.Equipo || ''
        }));

        const rolLower = rol.toLowerCase();
        if (rolLower === 'admin' || rolLower === 'administrador') {
          window.location.href = 'admin.html';
        } else if (rolLower === 'supervisor') {
          window.location.href = 'supervisor.html';
        } else {
          window.location.href = 'asesor.html';
        }
      } catch (err) {
        msg.innerText = 'Error de conexión con el servidor.';
        btn.disabled = false;
        btn.innerText = 'INGRESAR';
      }
    }
  </script>
</body>
</html>
