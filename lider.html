<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Líder - Martec</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap');
    
    * {
      box-sizing: border-box;
    }

    :root { 
      --primary: #3b82f6;
      --primary-grad: linear-gradient(135deg, #06b6d4 0%, #3b82f6 55%, #6366f1 100%);
      --accent-grad: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
      --text-main: #0f172a; 
      --text-light: #64748b; 
      --border-color: #e2e8f0; 
      --shadow-relief: 0 12px 30px -8px rgba(59, 130, 246, 0.14), 0 4px 12px -2px rgba(15, 23, 42, 0.05), inset 0 1px 0 rgba(255, 255, 255, 1);
      --radius-md: 12px; 
      --radius-lg: 20px; 
    }
    
    body, html { 
      margin: 0; 
      padding: 0; 
      width: 100%;
      height: 100%; 
      font-family: 'Outfit', sans-serif; 
      background-color: #ffffff;
      background-image:
        radial-gradient(circle at 18% 10%, rgba(6, 182, 212, 0.09) 0%, transparent 38%),
        radial-gradient(circle at 92% 88%, rgba(99, 102, 241, 0.11) 0%, transparent 40%);
      color: var(--text-main); 
      display: flex; 
      overflow: hidden; 
    }
    
    .sidebar { 
      width: 265px; 
      flex-shrink: 0;
      background: #ffffff; 
      color: var(--text-main); 
      display: flex; 
      flex-direction: column; 
      border-right: 1px solid #e2e8f0;
      box-shadow: 6px 0 30px rgba(37, 99, 235, 0.07);
      z-index: 10; 
    }
    
    .sidebar-brand { 
      padding: 24px; 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      border-bottom: 1px solid #f1f5f9; 
    }
    
    .brand-text h2 { 
      margin: 0; 
      font-size: 26px; 
      font-weight: 900; 
      letter-spacing: -0.8px;
      color: #000000;
      line-height: 1.05;
    }

    .brand-text span {
      font-size: 11px;
      color: #06b6d4;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 1.5px;
    }
    
    .menu { 
      list-style: none; 
      padding: 18px 14px; 
      margin: 0; 
      flex: 1; 
    }
    
    .menu li { 
      padding: 13px 16px; 
      margin-bottom: 8px; 
      cursor: pointer; 
      border-radius: 14px; 
      color: #475569; 
      font-weight: 600; 
      font-size: 14px; 
      transition: all 0.25s ease; 
    }
    
    .menu li:hover { 
      background-color: #f0f9ff; 
      color: #2563eb;
      transform: translateX(4px);
    }

    .menu li.active {
      background: var(--primary-grad);
      color: #ffffff;
      font-weight: 700;
      box-shadow: 0 10px 20px -6px rgba(59, 130, 246, 0.55), inset 0 1px 2px rgba(255,255,255,0.35);
    }
    
    .menu-logout { 
      margin-top: auto; 
      color: #e11d48 !important; 
      border-top: 1px solid #f1f5f9;
    }

    .menu-logout:hover {
      background-color: #fff1f2 !important;
      color: #be123c !important;
    }
    
    .main-wrapper { 
      flex: 1; 
      min-width: 0;
      width: 100%;
      display: flex; 
      flex-direction: column; 
      overflow: hidden; 
      background: transparent; 
    }
    
    .topbar { 
      height: 74px; 
      width: 100%;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #e2e8f0; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 0 32px; 
    }
    
    .topbar-title { 
      font-size: 20px; 
      font-weight: 800; 
      color: #0f172a; 
    }
    
    .topbar-user {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 700;
      background: #ffffff;
      padding: 6px 8px 6px 16px;
      border-radius: 999px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
    }

    .avatar {
      width: 36px;
      height: 36px;
      background: var(--primary-grad);
      border-radius: 50%;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 800;
      box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4);
    }

    .main-content { 
      flex: 1; 
      width: 100%;
      padding: 28px 32px; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
    }
    
    #vista-dashboard {
      width: 100%;
    }

    .dashboard-grid { 
      width: 100%;
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 22px; 
      margin-bottom: 22px;
    }
    
    .dash-card { 
      width: 100%;
      background: #ffffff; 
      border: 1px solid #e2e8f0; 
      border-radius: var(--radius-lg); 
      padding: 24px;
      box-shadow: var(--shadow-relief);
      position: relative;
      overflow: hidden;
    }

    .dash-card::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: var(--primary-grad);
    }
    
    .dash-value { 
      font-size: 36px; 
      font-weight: 900; 
      background: var(--primary-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 10px 0 0 0; 
    }
    
    .table-container { 
      width: 100%;
      background-color: #ffffff; 
      border-radius: var(--radius-lg); 
      border: 1px solid #e2e8f0; 
      padding: 24px; 
      box-shadow: var(--shadow-relief);
      display: none; 
      flex-direction: column;
      overflow-x: auto;
    }

    .filter-input {
      padding: 9px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      font-size: 13px;
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      outline: none;
      background: #f8fafc;
      color: #0f172a;
    }

    .filter-input:focus {
      background: #ffffff;
      border-color: #3b82f6;
    }
    
    table { 
      width: 100%; 
      border-collapse: collapse; 
      text-align: left; 
      margin-top: 15px; 
    }
    
    th { 
      background-color: #f8fafc; 
      color: #64748b; 
      padding: 14px 18px; 
      font-size: 11px; 
      text-transform: uppercase; 
      font-weight: 800; 
      letter-spacing: 0.8px;
      border-bottom: 2px solid #e2e8f0; 
      white-space: nowrap;
    }
    
    td { 
      padding: 14px 16px; 
      font-size: 13px; 
      font-weight: 600; 
      border-bottom: 1px solid #f1f5f9; 
    }

    tbody tr:hover {
      background: #f8fafc;
    }

    /* MATRIZ DE ASISTENCIA MENSUAL */
    .asis-matrix-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      margin-top: 16px;
    }

    .asis-matrix {
      margin-top: 0;
      border-collapse: collapse;
      width: max-content;
      min-width: 100%;
    }

    .asis-matrix th, .asis-matrix td {
      padding: 10px 8px;
      text-align: center;
      border-right: 1px solid #f1f5f9;
    }

    .asis-matrix th.col-sticky,
    .asis-matrix td.col-sticky {
      position: sticky;
      left: 0;
      background: #ffffff;
      z-index: 2;
      text-align: left;
      padding: 10px 14px;
      min-width: 240px;
      border-right: 2px solid #e2e8f0;
    }

    .asis-matrix th.col-sticky {
      background: #f8fafc;
      z-index: 3;
    }

    .asis-select {
      width: 68px;
      padding: 6px 4px;
      border-radius: 8px;
      border: 1.5px solid #cbd5e1;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 12px;
      text-align: center;
      cursor: pointer;
      outline: none;
      background: #f8fafc;
      color: #0f172a;
    }

    .asis-A { background: #dcfce7 !important; color: #15803d !important; border-color: #86efac !important; }
    .asis-T { background: #fef9c3 !important; color: #854d0e !important; border-color: #fde047 !important; }
    .asis-F { background: #ffe4e6 !important; color: #be123c !important; border-color: #fda4af !important; }
    .asis-Justificado { background: #e0f2fe !important; color: #0369a1 !important; border-color: #7dd3fc !important; }

    .motivo-tag {
      display: block;
      font-size: 10px;
      color: #0369a1;
      max-width: 72px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin: 3px auto 0;
      cursor: help;
    }
    
    .badge-activo { 
      padding: 5px 12px; 
      border-radius: 999px; 
      font-size: 11px; 
      font-weight: 800; 
      background: #dcfce7; 
      color: #15803d; 
      text-transform: uppercase;
    }

    .badge-falta {
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      background: #ffe4e6;
      color: #be123c;
      text-transform: uppercase;
    }
    
    .btn-action { 
      padding: 9px 16px; 
      font-size: 12px; 
      border-radius: 10px; 
      border: none; 
      font-weight: 700; 
      font-family: 'Outfit', sans-serif;
      cursor: pointer; 
      background: var(--primary-grad); 
      color: #ffffff;
      box-shadow: 0 6px 14px -4px rgba(59, 130, 246, 0.45);
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-action:hover {
      transform: translateY(-2px);
    }

    .btn-excel {
      background: var(--accent-grad);
      box-shadow: 0 6px 14px -4px rgba(16, 185, 129, 0.45);
    }

    .btn-dark {
      background: linear-gradient(135deg, #334155, #0f172a);
      box-shadow: 0 6px 14px -4px rgba(15, 23, 42, 0.35);
    }
    
    .modal-overlay { 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(6px);
      display: none; 
      justify-content: center; 
      align-items: center; 
      z-index: 1000; 
    }
    
    .modal-box { 
      width: 90%; 
      max-width: 820px; 
      height: 85vh;
      background: #ffffff; 
      border-radius: 24px; 
      display: flex; 
      flex-direction: column; 
      overflow: hidden; 
      box-shadow: 0 25px 60px rgba(15, 23, 42, 0.3);
      border: 1px solid #e2e8f0;
    }

    .modal-box.compact {
      max-width: 560px;
      height: auto;
      max-height: 90vh;
    }

    .modal-box.dark-mode { 
      background: #0f172a; 
      max-width: 1100px; 
      border: 1px solid rgba(255,255,255,0.12); 
    }
    
    .modal-header { 
      padding: 18px 24px; 
      background: var(--primary-grad); 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    
    .modal-title { 
      margin: 0; 
      color: #ffffff; 
      font-size: 15px; 
      font-weight: 800; 
      text-transform: uppercase; 
    }
    
    .modal-content-area { 
      flex: 1; 
      overflow-y: auto; 
      padding: 22px; 
      background: #f8fafc;
      height: 100%;
    }

    .modal-box.dark-mode .modal-content-area { 
      padding: 0; 
      background: #000000; 
      overflow: hidden; 
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #475569;
      margin-bottom: 6px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      background: #ffffff;
      outline: none;
    }
    
    .eval-row { 
      background: #ffffff; 
      border: 1px solid #e2e8f0; 
      border-radius: 14px; 
      padding: 16px; 
      margin-bottom: 14px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
    }
    
    .correct { 
      background: #dcfce7; 
      color: #15803d; 
      padding: 5px 10px; 
      border-radius: 8px; 
      font-size: 12px;
      font-weight: 700;
    }
    
    .incorrect { 
      background: #ffe4e6; 
      color: #be123c; 
      padding: 5px 10px; 
      border-radius: 8px; 
      font-size: 12px;
      font-weight: 700;
    }
    
    .feedback-box { 
      background: #ffffff; 
      padding: 20px 24px; 
      border-top: 2px solid #e0f2fe; 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
    }
    
    .feedback-box textarea { 
      width: 100%; 
      padding: 12px; 
      border: 1.5px solid #e2e8f0; 
      border-radius: 12px; 
      resize: none; 
      font-family: 'Outfit', sans-serif; 
      outline: none; 
      box-sizing: border-box;
      background: #f8fafc;
    }

    .materiales-grid { 
      width: 100%;
      display: none; 
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
      gap: 26px; 
      padding-bottom: 40px; 
    }
    
    .card { 
      background: #ffffff; 
      border-radius: 22px; 
      border: 1px solid #e2e8f0; 
      box-shadow: var(--shadow-relief); 
      overflow: hidden; 
      display: flex; 
      flex-direction: column; 
      transition: all 0.3s ease; 
    }
    
    .card:hover { 
      transform: translateY(-8px); 
      border-color: #3b82f6; 
      box-shadow: 0 22px 40px -10px rgba(59, 130, 246, 0.25); 
    }
    
    .card-preview { 
      height: 165px; 
      background: linear-gradient(135deg, #e0f2fe 0%, #ede9fe 100%); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      position: relative; 
      overflow: hidden; 
    }
    
    .tech-pattern { 
      position: absolute; 
      top: 0; left: 0; right: 0; bottom: 0; 
      background-image: linear-gradient(rgba(59, 130, 246, 0.12) 1px, transparent 1px), linear-gradient(90deg, rgba(59, 130, 246, 0.12) 1px, transparent 1px); 
      background-size: 20px 20px; 
      z-index: 1; 
    }
    
    .preview-icon { 
      width: 62px; 
      height: 62px; 
      fill: #2563eb; 
      z-index: 4; 
      filter: drop-shadow(0 8px 16px rgba(59, 130, 246, 0.35)); 
    }
    
    .card-preview img { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      z-index: 3; 
    }
    
    .play-icon { 
      position: absolute; 
      width: 56px; 
      height: 56px; 
      background: var(--primary-grad); 
      border-radius: 50%; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      color: #ffffff; 
      font-size: 20px; 
      padding-left: 4px; 
      z-index: 5;
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.55);
    }
    
    .card-body { 
      padding: 20px 22px; 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      background: #ffffff; 
    }
    
    .card-title { 
      margin: 0 0 8px 0; 
      font-size: 16px; 
      font-weight: 800; 
      color: #0f172a; 
      text-transform: uppercase; 
    }
    
    .card-desc { 
      margin: 0; 
      font-size: 13px; 
      color: #64748b; 
      display: -webkit-box; 
      -webkit-line-clamp: 3; 
      -webkit-box-orient: vertical; 
      overflow: hidden; 
    }
    
    .card-footer { 
      padding: 0 22px 22px; 
      background: #ffffff; 
    }
    
    .btn-ver { 
      width: 100%; 
      padding: 12px; 
      border: none; 
      border-radius: 12px; 
      background: var(--primary-grad); 
      color: #ffffff; 
      font-weight: 800; 
      font-family: 'Outfit', sans-serif;
      letter-spacing: 0.6px;
      cursor: pointer; 
      box-shadow: 0 8px 18px -5px rgba(59, 130, 246, 0.45);
      transition: 0.25s; 
    }
    
    .btn-ver:hover { 
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -5px rgba(99, 102, 241, 0.6); 
    }
    
    .watermark {
      position: fixed; 
      bottom: 10px; 
      right: 16px; 
      font-size: 11px; 
      color: #94a3b8; 
      font-weight: 700; 
      z-index: 9999; 
      letter-spacing: 0.6px; 
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  
  <div class="watermark">Desarrollado por Jonatan Santiago Guerrero</div>

  <div class="sidebar">
    <div class="sidebar-brand">
      <svg width="42" height="34" viewBox="0 0 120 96" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;">
        <path d="M40 16L14 48L40 80" stroke="#38D394" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M80 16L106 48L80 80" stroke="#38D394" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="60" y="29" width="27" height="27" transform="rotate(45 60 29)" fill="#000000"/>
      </svg>
      <div class="brand-text"><h2>martec</h2><span>Portal Líder</span></div>
    </div>
    <ul class="menu">
      <li id="tab-dashboard" class="active" onclick="switchTab('Dashboard')">📊 Analítica General</li>
      <li id="tab-equipo" onclick="switchTab('Equipo')">👥 Gestión de Asesores</li>
      <li id="tab-asistencia" onclick="switchTab('Asistencia')">📅 Asistencia Mensual</li>
      <li id="tab-evaluaciones" onclick="switchTab('Evaluaciones')">📝 Resultados Evaluación</li>
      <li id="tab-materiales" onclick="switchTab('Materiales')">📚 Material Capacitación</li>
      <li class="menu-logout" onclick="window.location.href='index.html'">🚪 Cerrar Sesión</li>
    </ul>
  </div>

  <div class="main-wrapper">
    <div class="topbar">
      <div class="topbar-title" id="titulo-seccion">Analítica General</div>
      <div class="topbar-user"><span id="nombre-lider">Cargando...</span><div class="avatar">L</div></div>
    </div>

    <div class="main-content">
      
      <!-- VISTA DASHBOARD -->
      <div id="vista-dashboard" style="display:flex; flex-direction:column;">
         <div class="dashboard-grid">
            <div class="dash-card">
              <div style="font-size:12px; font-weight:800; color:var(--text-light); letter-spacing:1px;">TOTAL ASESORES</div>
              <div class="dash-value" id="kpi-team">0</div>
            </div>
            <div class="dash-card">
              <div style="font-size:12px; font-weight:800; color:var(--text-light); letter-spacing:1px;">SUPERVISORES</div>
              <div class="dash-value" id="kpi-sups">0</div>
            </div>
            <div class="dash-card">
              <div style="font-size:12px; font
